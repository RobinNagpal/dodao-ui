name: "insights-ui: tariff data freshness"

# Weekly check that the tariff data behind the calculator and the chapter pages is still current
# (issue #1785, Phase 5). Runs `src/scripts/tariff-calculator/check-data-freshness.ts` (= `pnpm tariff:freshness`), which:
#   1. compares the HTS edition hts.usitc.gov marks "current" with the edition our committed data records;
#   2. lists tariff-related Federal Register documents (USTR, presidential documents, BIS Section 232, CBP,
#      any "Chapter 99" HTS amendment) published in the last 8 days that our data doesn't cite yet;
#   3. lists measures in measures.json whose effectiveFrom / effectiveTo falls in the next 14 days.
#
# Report only: it never edits data or touches the database. When there is something to report it opens ONE issue
# titled "Tariff data freshness: updates to review", or comments on that issue if it is still open (found by exact
# title). Close the issue once everything in it is applied or dismissed; the next finding opens a fresh one.
# See docs/insights-ui/tariffs/calculator-data-refresh.md ("Weekly freshness check").

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Federal Register look-back window in days"
        type: string
        default: "8"
      create_issue:
        description: "Open/update the GitHub issue (false = only print the report in the job summary)"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: insights-ui-tariff-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: insights-ui
    env:
      ISSUE_TITLE: "Tariff data freshness: updates to review"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The script imports only Node built-ins, so skip the full workspace install and run it with a pinned tsx
      # (same version as pnpm-lock.yaml). `pnpm tariff:freshness` runs the same file locally.
      - name: Run the freshness check
        id: report
        env:
          DAYS: ${{ inputs.days || '8' }}
        run: |
          set -euo pipefail
          npx --yes tsx@4.21.0 src/scripts/tariff-calculator/check-data-freshness.ts --days "$DAYS" --out "$RUNNER_TEMP/tariff-freshness.md" > /dev/null
          cat "$RUNNER_TEMP/tariff-freshness.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the freshness issue
        if: steps.report.outputs.has_findings == 'true' && (github.event_name == 'schedule' || inputs.create_issue)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/issue-body.md"
          {
            # GitHub caps issue/comment bodies at 65,536 characters.
            if [ "$(wc -c < "$RUNNER_TEMP/tariff-freshness.md")" -gt 60000 ]; then
              head -c 60000 "$RUNNER_TEMP/tariff-freshness.md"
              printf '\n\n_Report truncated — the full report is in the [workflow run summary](%s)._\n' "$RUN_URL"
            else
              cat "$RUNNER_TEMP/tariff-freshness.md"
            fi
            printf '\n---\n_Generated by [insights-ui: tariff data freshness](%s) (`pnpm tariff:freshness`). Review each item and apply it through docs/insights-ui/tariffs/calculator-data-refresh.md; close this issue when everything is applied or dismissed. Part of #1785._\n' "$RUN_URL"
          } > "$body"

          # Dedupe: reuse the open issue with exactly this title (listed, not searched, so a just-created issue is found too).
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number,title \
            --jq "map(select(.title == env.ISSUE_TITLE)) | sort_by(.number) | .[0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body"
            echo "Commented on #$existing" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$body")"
            echo "Opened $url" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Nothing to report
        if: steps.report.outputs.has_findings != 'true'
        run: echo "Tariff data is current — no issue opened." | tee -a "$GITHUB_STEP_SUMMARY"
