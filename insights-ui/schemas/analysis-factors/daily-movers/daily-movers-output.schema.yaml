$schema: 'http://json-schema.org/draft-07/schema#'
type: object
additionalProperties: false
properties:
  title:
    type: string
    description: 'Article title, max 60 characters: company name (no Inc./Corp.), ticker in brackets, direction and main reason. No date.'
  metaDescription:
    type: string
    description: 'SEO meta description, 140-160 characters, one sentence: name, ticker, percentage move, main reason.'
  oneLineExplanation:
    type: string
    description: 'One plain-English sentence (max 35 words) on why the stock moved, with the percentage and main driver.'
  detailedExplanation:
    type: string
    description: 'Markdown article of 1,000-1,300 words in simple language, with ### question headings: why it moved, what the company does, recent history, what happened after similar moves, what happens next, risks, FAQ. Sourced numbers carry markdown links.'
required:
  - title
  - metaDescription
  - oneLineExplanation
  - detailedExplanation
